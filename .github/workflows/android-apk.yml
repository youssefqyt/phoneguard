name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "API base URL reachable from your phone, including /api/v1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;27.1.12297006"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Set API URL in APK
        working-directory: mobile
        env:
          PHONEGUARD_API_URL: ${{ inputs.api_url }}
        run: node scripts/configure-api-url.js

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon :app:assembleRelease -PusesCleartextTraffic=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phoneguard-android-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
