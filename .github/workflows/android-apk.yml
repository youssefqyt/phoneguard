
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: API base URL reachable by the phone, ending in /api/v1
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install NDK
        run: sdkmanager "ndk;27.1.12297006"

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Configure API URL
        working-directory: mobile
        env:
          PHONEGUARD_API_URL: ${{ inputs.api_url || vars.PHONEGUARD_API_URL || secrets.PHONEGUARD_API_URL || 'http://10.0.2.2:3000/api/v1' }}
        run: node scripts/configure-api-url.js

      - name: Build release APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew --no-daemon :app:assembleRelease -PusesCleartextTraffic=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phoneguard-android-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
